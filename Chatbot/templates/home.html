<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ISET Chatbot Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .background-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      filter: brightness(0.6);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      background: radial-gradient(circle at 20% 20%, #0E7490 0%, #0F172A 55%, #020617 100%);
    }

    .overlay h1 {
      font-size: 3em;
      margin-bottom: 40px;
    }
    .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 40px;
    }
    
    .buttons button {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.1em;
        background-color: white;
        color: black;
        border: none;
        padding: 12px 24px;
        border-radius: 10px;
        box-shadow: 0 5px #ccc;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        top: 0;
    }
    
    .buttons button:hover {
        background-color: #f0f0f0;
        box-shadow: 0 7px #bbb;
        top: -2px;
    }
    
    .buttons button:active {
        box-shadow: 0 2px #999;
        top: 2px;
    }
    

    .slide-page {
      position: fixed;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100%;
      background: white;
      transition: left 0.5s ease-in-out;
      z-index: 10;
    }

    .slide-page.active {
      left: 0;
    }
    h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 2em;
        color: white;
        white-space: nowrap;
        overflow: hidden;
        width: 0;
        animation: typing 3s steps(40, end) forwards, blink-caret 0.75s step-end 3s forwards;
        margin: 20px auto;
        text-align: center;
    }
    
    @keyframes typing {
        from { width: 0 }
        to { width: 100% }
    }
    
   
    
    .logo-container {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
    }
    
    .logo-container img {
        height: 60px;
        width: auto;
    }
    
  </style>
</head>
<body>
  <div class="overlay">
    <div class="logo-container">
        <img src="{{ url_for('static', filename='logo_iset_sfax_white.svg') }}" alt="ISET Logo">
      </div>
    <h1>Welcome to ISET Smart Assistant</h1>
    <div class="buttons">
      <button onclick="goToChatbot()">ISET Chatbot</button>
      <button onclick="chooseModel()">Model Chooser</button>
    </div>
  </div>

  <!-- Hidden chatbot iframe -->
  <div id="chatbotPage" class="slide-page">
    <iframe src="/" style="width:100%; height:100%; border:none;"></iframe>
  </div>

  <script>
    function goToChatbot() {
        window.location.href = "/chatbot";
      }
    
      function chooseModel() {
        window.location.href = "/upload";
      }
</script>

  </script>
</body>
</html>
